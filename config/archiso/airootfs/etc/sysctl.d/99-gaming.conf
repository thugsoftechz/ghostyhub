# Gaming Performance Tuning
# Increase virtual memory map count (needed for some games/emulators like Switch)
vm.max_map_count = 1048576

# Reduce swapping behavior
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Network tuning for low latency
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

# Kernel scheduler tuning (latency focus)
kernel.sched_min_granularity_ns = 5000000
kernel.sched_wakeup_granularity_ns = 5000000
kernel.sched_migration_cost_ns = 500000
kernel.numa_balancing = 0

# Increase open file limits
fs.file-max = 524288

LABEL arch64
TEXT HELP
Boot the TurboLinux Gaming Distro (Live) on BIOS.
It allows you to install TurboLinux or perform system maintenance.
ENDTEXT
MENU LABEL Boot TurboLinux (x86_64)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y nvidia_drm.modeset=1 cow_spacesize=10G

LABEL arch64ram
TEXT HELP
Boot the TurboLinux Gaming Distro (Live) on BIOS with Copy-to-RAM.
Ensures zero latency by running everything from memory.
ENDTEXT
MENU LABEL Boot TurboLinux (x86_64) (Copy to RAM)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y nvidia_drm.modeset=1 cow_spacesize=10G

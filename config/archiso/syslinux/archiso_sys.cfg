LABEL arch64
TEXT HELP
Boot GhostyHub (GHOST-OS X) Live.
The world's most aggressive gaming platform.
ENDTEXT
MENU LABEL Boot GhostyHub (Live)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y nvidia_drm.modeset=1 cow_spacesize=10G ghost_mode=game

LABEL arch64safe
TEXT HELP
Boot GhostyHub in Safe Mode (Nomodeset).
Use this if the default mode fails to boot.
ENDTEXT
MENU LABEL Boot GhostyHub (Safe Mode)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram=y nvidia_drm.modeset=1 cow_spacesize=10G ghost_mode=safe nomodeset
